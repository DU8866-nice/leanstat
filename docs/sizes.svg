<title id="t">Lines of Lean code in famous formalizations</title>
<desc id="d">The Lean proof of the Riemann Hypothesis has 13.7 million lines of code, 8.8 times all of Mathlib (1.55 million). Data: data/2026-11-25/projects.tsv</desc>
