name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Measure a real project end to end
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --depth 1 https://github.com/teorth/pfr /tmp/pfr
          python leanstat.py /tmp/pfr --html /tmp/pfr.html
